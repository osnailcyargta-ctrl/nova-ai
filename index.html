<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — AI from scratch</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: system-ui, sans-serif; background:#0f0f10; color:#e4e4e7; }
  .box { text-align:center; }
  .ring { width:54px; height:54px; border:3px solid #3f3f46; border-top-color:#a1a1aa;
          border-radius:50%; margin:0 auto 22px; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:22px; font-weight:600; letter-spacing:.3px; }
  p { color:#71717a; font-size:14px; line-height:1.6; max-width:420px; }
</style>
</head>
<body>
  <div class="box">
    <div class="ring"></div>
    <h1>Nova is training</h1>
    <p>A 17M-parameter transformer, built and trained completely from scratch.<br>
       The lab is still running — come back soon.</p>
  </div>
</body>
</html>
